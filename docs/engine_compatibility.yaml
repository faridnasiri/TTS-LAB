  s2pro:
    status: supported
    container: s2pro
    stack: sglang
    vram_est_mb: 11000
    sglang_model: fishaudio/s2-pro
    sglang_image: tts-lab-sglang-omni:latest
    serving: sgl-omni serve --model-path fishaudio/s2-pro --config s2pro_tts.yaml --port 8000
    unblocked_on: 2026-08-22 (sglang-omni 0.1.3 — day-0 S2-Pro support, sm_120-validated upstream)
    requires:
    - flashinfer 0.6.14 JIT — sm_120 has no prebuilt kernel cache, container compiles its own (devel base = nvcc; cache persisted via /opt/models/flashinfer-jit mount)
    - descript-audiotools 0.7.2 + descript-audio-codec 1.0.0 — installed --no-deps (audiotools pins protobuf<3.20 which would break cutlass-dsl's protobuf 6.x)
    - torch nightly cu130 — overrides sglang-omni's torch==2.11.0 pin (no sm_120)
    notes: Dual-AR 5B, 80+ langs. Voice clone via references [{audio_path, text}] — 10-30 s clip + transcript. Always-resident while the container runs (~11 GB) — orchestrator stops/starts it around EditX/LLM loads (Docker socket).
    validation:
      model_load:
        status: verified
        last_tested: 2026-08-22
        description: sgl-omni serve /health 200 on RTX 5060 Ti (flashinfer sm_120 JIT compile)
      synthesis:
        status: verified
        last_tested: 2026-08-22
        description: POST /v1/audio/speech returns WAV bytes — 4.6 s synth, 44.1 kHz
      voice_clone:
        status: verified
        last_tested: 2026-08-23
        description: references[{audio_path, text}] — en-leo + transcript → 3.8 s / 44.1 kHz WAV, error=None (full stop/start protocol round-trip)
      vram_measured:
        status: verified
        last_tested: 2026-08-22
        description: nvidia-smi — ~11.75 GB pipeline, 15,540 MiB peak (vocoder codec on CPU)
  editx:
    status: supported
    container: engine-editx
    stack: editx
    vram_est_mb: 12800
    notes: Step Audio EditX 3B AWQ-4bit — audio edit + zero-shot TTS. clone/emotion/style/speed/paralinguistic edit types; needs ref WAV + transcript for cloning. 24 kHz output. HEAVY (~12.8 GB resident) — orchestrator stops s2pro/LLM before load.
    validation:
      model_load:
        status: verified
        last_tested: 2026-08-23
        description: Engine load 174 s — vllm 0.26 nightly + torch 2.13.0+cu130 (sm_120); all 4 fix layers baked (step1 default, CCCL gate, cu13 symlinks, BatchEncoding coercion)
      synthesis:
        status: verified
        last_tested: 2026-08-23
        description: POST /synthesize/editx — 200 OK, valid 24 kHz WAV, ~5 s generate (load-dominated RTF 26)
      edit_types:
        status: verified
        last_tested: 2026-08-23
        description: emotion (8.0 s, RTF 2.26), style (6.2 s, RTF 1.93), speed (10.4 s, RTF 1.70) — all error=None
      voice_clone:
        status: verified
        last_tested: 2026-08-23
        description: audio_prompt_id + ref_text → 6.5 s sane output. Since the 2026-08-23 UI fix, ref_text falls back to the sidecar transcription (whisper-transcribed for curated en-* voices, real transcripts for voice-library voices) before the target-text fallback — no more flat/robotic clones from the dropdown
  qwen36:
    status: removed
    container: llm-qwen36
    stack: llm
    vram_est_mb: 13000
    engine_type: llm
    removed: 2026-08-23
    notes: LLM RETIRED per user decision (never wanted) — container + llama.cpp images deleted 2026-08-23, compose service and QWEN36_URL removed 2026-08-23, entry dropped from MODEL_ORDER so no dead probe in /status. Dead code (_load/_synth_qwen36, chat UI) left in place.
