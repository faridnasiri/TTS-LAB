stacks:
  current:
    torch: '>=2.12,<2.13'
    transformers: '>=5.12.1,<5.13'
    python: '3.10'
    cuda: '12.8'
    note: torch is nightly (2.12.0.dev*) — range captures major version only
    validated_on:
      torch: null
      transformers: null
      cuda: null
      driver: null
  mid:
    torch: '>=2.12,<2.15'
    transformers: '>=4.50,<5.0'
    python: '3.10'
    cuda: '12.8'
    note: torch nightly for sm_120 (RTX 5060 Ti). 'mid' refers to transformers 4.x, not torch stability.
    validated_on:
      torch: 2.12.0.dev20260408+cu128
      transformers: 4.51.3
      cuda: '12.8'
      driver: 580.159.03
  legacy:
    torch: '>=1.13,<1.14'
    transformers: '>=4.46,<5.0'
    python: '3.10'
    cuda: '11.7'
  editx:
    torch: 2.13.0+cu130 (stable — sm_120)
    transformers: '>=4.57.3,<5.0'
    python: '3.12'
    cuda: '12.8'
    note: Step-Audio-EditX own container (ubuntu24.04) — python 3.12 required (repo >=3.12,<3.14). vLLM 0.26 nightly wheel from wheels.vllm.ai (commit 30b34171b) + torch 2.13.0 stable — the repo's pinned wheel (torch-2.9.1-era) links c10_cuda_check_implementation, REMOVED from every sm_120-capable torch. Lab's other images are python 3.11 — cannot be reused. All 4 fix layers baked into Dockerfile.engine-editx (step1 intermediate_tensors default, CCCL version-gate, pip cu13 layout symlinks, tts.py BatchEncoding coercion).
