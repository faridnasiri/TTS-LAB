# S2-Pro pipeline config — vendored from sgl-project/sglang-omni
# examples/configs/s2pro_tts.yaml (https://github.com/sgl-project/sglang-omni)
# Used by Dockerfile.sglang: sgl-omni serve --config /opt/s2pro_tts.yaml
#
# runtime_overrides.tts_engine.server_args_overrides — the supported way
# to pass SGLang ServerArgs for this pipeline (the CLI flags
# --cuda-graph-max-bs-decode / --mem-fraction-static are rejected:
# extra_forbidden / "requires a pipeline with a supported target",
# 2026-08-22).
#
# Decode CUDA graphs are DISABLED (2026-08-22): capture OOM'd even with
# the batch sizes capped (cuda_graph_max_bs: 8 → "Capturing batches
# bs=8 avail_mem=0.84 GB" → CUDA OOM at a 16 MiB alloc). The 5B model
# (11.46 GiB bf16 in the static pool) + the separate vocoder stage + 3
# CUDA contexts leave no capture headroom on a 15.48 GiB card. A TTS
# engine decodes one request at a time — eager decode is the right
# trade; re-enabling graphs needs a smaller model footprint.
#
# Key names: cuda_graph_max_bs is omni's LEGACY PUBLIC knob —
# build_sglang_server_args's alias table translates it to SGLang's
# cuda_graph_max_bs_decode internally (setting the _decode name directly
# conflicts with the value build_generation_batch_overrides derives from
# max_running_requests: "Conflicting ... values: 64 != 8", 2026-08-22).
# max_running_requests must stay <= cuda_graph_max_bs (validator rejects
# "cuda_graph_max_bs must cover max_running_requests"). With graphs
# disabled the batch validator skips the graph checks; max_running_requests
# is capped anyway so the KV cache (sized inside the static pool) stays
# small and the pool fits the model + eager decode activations.
#
# VRAM budget (2026-08-22, still OOM after graphs-off at 0.8/8):
# 5B bf16 weights ~10 GiB + KV + vocoder/preprocessing stages (~3.4 GiB)
# + host tenants (~0.4 GiB) = ~15.5 GiB on a 15.48 GiB card. The pool
# ceiling must drop (0.8 -> 0.75) and KV slots must shrink (8 -> 2) —
# a TTS engine decodes one request at a time.
config_cls: S2ProPipelineConfig
model_path: fishaudio/s2-pro
runtime_overrides:
  tts_engine:
    server_args_overrides:
      disable_cuda_graph: true
      max_running_requests: 2
      mem_fraction_static: 0.75
