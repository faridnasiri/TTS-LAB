name: Build and Push Docker Images

# ═══════════════════════════════════════════════════════════════════
# CI/CD: builds the lab's container images and pushes them to GHCR.
#
# Triggered on:
#   - Push to main that changes Dockerfiles or Python source
#   - Manual trigger (workflow_dispatch) — plans every image
#
# How it decides what to build
#   `.github/scripts/build_plan.py` holds the image table (image, Dockerfile,
#   parent, the files that invalidate it) and diffs github.event.before against
#   github.sha. Its output is three JSON matrices — base, stacks, engines/apps —
#   and each tier waits for the one below it, because a tier's images are built
#   FROM the images the tier below just pushed.
#
#   Adding an engine is one row in that table. That matters: the previous
#   per-image glob list silently left engine-qwen (which is in the DEFAULT
#   compose profile), engine-mid, engine-fa, engine-editx, the sglang image and
#   both py311 stacks out of CI entirely.
#
# Images (ghcr.io/${{ github.repository_owner }}/tts-lab/<image>):
#   tts-lab-base, tts-lab-base-py311
#   tts-lab-stack-current, -stack-legacy, -stack-mid, -stack-py311
#   tts-lab-engine-current, -engine-legacy, -engine-mid, -engine-qwen,
#   -engine-py311, -engine-omni, -engine-editx, -engine-fa
#   tts-lab-orchestrator, tts-lab-orpheus, tts-lab-sglang-omni
#
# NOT buildable here: `tts-lab-sglang`, which compose uses for the vibevoice and
# higgs services. That tag is a pip-built POC image and no Dockerfile for it
# exists in this repository, so nothing can reproduce it — see docs/issues/.
#
# The first time an engine on a stack that has never been published is planned,
# its build pulls the parent from GHCR and fails if it is absent; push the stack
# (or run the workflow manually) first.
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'tts_lab.py'
      - 'tts_lab_shims.py'
      - 'tts_lab_shims_legacy.py'
      - 'tts_lab_config.py'
      - 'tts_lab_utils.py'
      - 'tts_lab_engines.py'
      - 'tts_lab_dispatch.py'
      - 'tts_lab_ui.py'
      - 'tts_lab_history.py'
      - 'tts_lab_engine_server.py'
      - 'tts_lab_orpheus_server.py'
      - 'lab_infra.py'
      - 'lab_infra_ui.py'
      - 'voice_library.py'
      - 'pyproject.toml'
      - 'patches/**'
      - '.github/workflows/build-images.yml'
      - '.github/scripts/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR paths must be lowercase, and ${{ github.repository }} is not.
  IMAGE_PREFIX: ${{ github.repository_owner }}/tts-lab

jobs:
  # ── Decide what to rebuild ──────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-22.04
    outputs:
      tier1: ${{ steps.plan.outputs.tier1 }}
      tier2: ${{ steps.plan.outputs.tier2 }}
      tier3: ${{ steps.plan.outputs.tier3 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the planner runs `git diff before..after`
      - id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 .github/scripts/build_plan.py

  # ── Tier 1 — base images (parents are public CUDA images) ───────
  build-tier1:
    needs: detect-changes
    if: needs.detect-changes.outputs.tier1 != '[]'
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.detect-changes.outputs.tier1) }}
    name: ${{ matrix.entry.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Free disk space
        if: matrix.entry.freespace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h / | tail -1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.entry.dockerfile }}
          push: true
          tags: ${{ matrix.entry.tag }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BASE_IMAGE=${{ matrix.entry.parent }}
          cache-from: type=gha,scope=${{ matrix.entry.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.entry.image }}

  # ── Tier 2 — ML stacks (built on tier 1) ────────────────────────
  build-tier2:
    needs: [detect-changes, build-tier1]
    if: |
      always() && !cancelled() &&
      needs.detect-changes.outputs.tier2 != '[]' &&
      (needs.build-tier1.result == 'success' || needs.build-tier1.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.detect-changes.outputs.tier2) }}
    name: ${{ matrix.entry.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Note where the parent comes from
        run: |
          echo "parent : ${{ matrix.entry.parent }}"
          # Diagnostic only, deliberately NOT fatal: buildx resolves the parent itself
          # (with the credentials from the login above) and reports far better than a
          # bare `docker pull` can. A failing guard here once skipped a build that would
          # otherwise have worked, which is strictly worse than the error it explained.
          docker pull "${{ matrix.entry.parent }}" || echo "::warning::pre-pull failed; buildx will resolve the parent"

      - name: Free disk space
        if: matrix.entry.freespace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h / | tail -1

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.entry.dockerfile }}
          push: true
          tags: ${{ matrix.entry.tag }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BASE_IMAGE=${{ matrix.entry.parent }}
          cache-from: type=gha,scope=${{ matrix.entry.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.entry.image }}

  # ── Tier 3 — engines, orchestrator, sidecars (built on tiers 1-2) ──
  build-tier3:
    needs: [detect-changes, build-tier1, build-tier2]
    if: |
      always() && !cancelled() &&
      needs.detect-changes.outputs.tier3 != '[]' &&
      (needs.build-tier1.result == 'success' || needs.build-tier1.result == 'skipped') &&
      (needs.build-tier2.result == 'success' || needs.build-tier2.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.detect-changes.outputs.tier3) }}
    name: ${{ matrix.entry.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Note where the parent comes from
        run: |
          echo "parent : ${{ matrix.entry.parent }}"
          # See the tier-2 note: a diagnostic, not a gate.
          docker pull "${{ matrix.entry.parent }}" || echo "::warning::pre-pull failed; buildx will resolve the parent"
      - name: Free disk space
        if: matrix.entry.freespace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h / | tail -1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.entry.dockerfile }}
          push: true
          tags: ${{ matrix.entry.tag }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            BASE_IMAGE=${{ matrix.entry.parent }}
          cache-from: type=gha,scope=${{ matrix.entry.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.entry.image }}
